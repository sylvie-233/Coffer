<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coffer · PC 端交互原型 v1</title>
<link rel="icon" type="image/png" href="../icon-v1.png" />
<style>
  :root{
    --outer:#E7E4DB;--rail:#F3F1EA;--list:#FBFAF5;--detail:#FFFFFF;
    --ink:#1E1C19;--ink-2:#56524A;--muted:#948E82;
    --line:#E3DFD4;--line-soft:#EDEAE1;
    --accent:#125B4A;--accent-soft:#E3EFEA;--brass:#AE8850;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--outer);color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px;
  }
  button{font-family:inherit;cursor:pointer;}

  .app{
    position:relative;height:calc(100vh - 48px);min-height:700px;
    display:grid;grid-template-columns:236px 316px 1fr;
    background:var(--detail);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(30,28,25,.06), 0 24px 60px -20px rgba(30,28,25,.28);
    border:1px solid rgba(30,28,25,.08);
  }

  /* ---------------- 左导航 ---------------- */
  .rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;}
  .brand{display:flex;align-items:center;gap:9px;padding:0 6px 18px;}
  .brand-mark{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;overflow:hidden;}
  .brand-name{font-size:15px;font-weight:650;letter-spacing:.06em;}
  .brand-name span{color:var(--brass);}

  .rail-top{padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:13px;}

  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 9px;height:34px;}
  .search svg{flex:none;color:var(--muted);}
  .search input{border:0;outline:0;background:none;font:inherit;font-size:13px;width:100%;color:var(--ink);}
  .search input::placeholder{color:#A9A398;}
  .kbd{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:var(--rail);flex:none;}

  .nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px;margin:6px 0 7px;font-weight:600;}
  .nav-label.row{display:flex;align-items:center;}
  .nav-label .plus{margin-left:auto;width:17px;height:17px;display:grid;place-items:center;border:0;background:none;border-radius:5px;color:var(--muted);padding:0;}
  .nav-label .plus:hover{background:#E7E3D8;color:var(--accent);}
  .nav-folder{cursor:pointer;user-select:none;}
  .nav-folder .fdot{width:5px;height:5px;border-radius:50%;flex:none;display:block;}
  .nav-folder .more{margin-left:3px;width:16px;height:16px;display:none;place-items:center;border-radius:4px;color:var(--muted);flex:none;font-size:13px;line-height:1;letter-spacing:0;}
  .nav-folder:hover .more{display:grid;}
  .nav-folder .more:hover{background:#DFDACE;color:var(--ink);}
  .folder-edit{display:none;align-items:center;gap:9px;padding:3px 8px;}
  .folder-edit.on{display:flex;}
  .folder-edit .fdot{width:5px;height:5px;border-radius:50%;flex:none;background:#C9C2B2;display:block;}
  .folder-edit input{flex:1;min-width:0;height:27px;border:1px solid #BBD5CB;border-radius:6px;padding:0 7px;font:inherit;font-size:12.5px;outline:0;background:#fff;color:var(--ink);}
  .frename{flex:1;min-width:0;height:27px;border:1px solid #BBD5CB;border-radius:6px;padding:0 7px;font:inherit;font-size:12.5px;outline:0;background:#fff;color:var(--ink);}
  .fmenu{position:absolute;z-index:58;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 30px -10px rgba(30,28,25,.34);padding:4px;min-width:118px;display:none;}
  .fmenu.on{display:block;}
  .fmenu button{display:flex;width:100%;align-items:center;gap:7px;padding:7px 9px;border:0;background:none;border-radius:6px;font-size:12.5px;color:var(--ink-2);text-align:left;}
  .fmenu button:hover{background:#F4F1E9;color:var(--ink);}
  .fmenu button.dgr:hover{background:#FBEFEF;color:#A84A55;}
  .fsw{display:grid;grid-template-columns:repeat(5,15px);gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .sw{width:15px;height:15px;border-radius:50%;border:0;padding:0;cursor:pointer;flex:none;}
  .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c);}
  .folder-swatches{display:none;flex-wrap:wrap;gap:7px;padding:7px 8px 0;}
  .folder-swatches.on{display:flex;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink-2);background:none;border:0;width:100%;text-align:left;}
  .nav-item:hover{background:#EAE7DE;}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav-item svg{color:#8E887C;flex:none;}
  .nav-item.active svg{color:var(--accent);}
  .nav-item .count{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .nav-item.active .count{color:var(--accent);opacity:.7;}

  .rail-spacer{flex:1;}
  .user{display:flex;align-items:center;gap:9px;padding:9px 8px;border-top:1px solid var(--line);margin-top:10px;cursor:pointer;border-radius:9px;transition:background .15s;}
  .user:hover{background:#E9E5DA;}
  .avatar{width:26px;height:26px;border-radius:50%;flex:none;background:#DCD5C6;color:#5A5348;display:grid;place-items:center;font-size:11px;font-weight:600;}
  .user-meta{line-height:1.25;overflow:hidden;}
  .user-meta b{font-size:12.5px;font-weight:600;display:block;}
  .user-meta i{font-size:11px;color:var(--muted);font-style:normal;}
  .lock-btn{margin-left:auto;color:var(--muted);background:none;border:0;display:grid;place-items:center;padding:2px;}
  .lock-btn:hover{color:var(--accent);}
  .power-btn{color:var(--muted);background:none;border:0;display:grid;place-items:center;padding:2px;}
  .power-btn:hover{color:#A84A55;}

  /* ---------------- 中列表 ---------------- */
  .col-list{background:var(--list);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;}
  .list-head{padding:20px 18px 12px;display:flex;align-items:flex-start;gap:10px;}
  .list-head h1{font-size:17px;font-weight:650;}
  .list-head p{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .list-tabs{display:flex;gap:6px;padding:0 18px 12px;flex:none;}
  .list-tabs .lt{height:27px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:transparent;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
  .list-tabs .lt:hover{background:#EFEBE1;color:var(--ink);}
  .list-tabs .lt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn-new{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border:0;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px;box-shadow:0 1px 2px rgba(18,91,74,.24);}
  .btn-new:hover{background:#0E4E3F;}

  .rows{overflow-y:auto;flex:1;padding:6px 10px 14px;}
  .row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;position:relative;width:100%;background:none;border:0;text-align:left;}
  .row:hover{background:#F0EDE4;}
  .row.sel{background:#fff;box-shadow:0 1px 2px rgba(30,28,25,.07),0 0 0 1px var(--line);}
  .row.sel::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2.5px;border-radius:2px;background:var(--accent);}
  .tile{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:700;}
  .row-txt{min-width:0;flex:1;line-height:1.3;}
  .row-txt b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-txt span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .strength{width:5px;height:5px;border-radius:50%;flex:none;}
  .fav-mark{flex:none;display:grid;place-items:center;color:var(--brass);opacity:.9;margin-right:-3px;}
  .s-strong{background:#2F8C63;}
  .s-mid{background:#D9A03C;}
  .s-img{background:var(--brass);}
  .s-none{background:#D5CFC0;}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8;padding:48px 20px;}

  .rows::-webkit-scrollbar,.detail-body::-webkit-scrollbar{width:8px;}
  .rows::-webkit-scrollbar-thumb{background:#DBD6C9;border-radius:8px;border:2px solid var(--list);}

  /* ---------------- 右详情 ---------------- */
  .col-detail{display:flex;flex-direction:column;min-width:0;background:var(--detail);}
  .detail-head{padding:22px 28px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:14px;}
  .big-tile{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:16px;font-weight:700;}
  .detail-title h2{font-size:17px;font-weight:650;}
  .detail-title .meta{display:flex;align-items:center;gap:7px;margin-top:5px;}
  .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2.5px 7px;border-radius:5px;}
  .dot-sep{width:3px;height:3px;border-radius:50%;background:#CFC9BB;}
  .detail-title .meta em{font-style:normal;font-size:11.5px;color:var(--muted);}
  .head-actions{margin-left:auto;display:flex;gap:8px;}
  .btn-ghost{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);padding:7px 11px;}
  .btn-ghost:hover{border-color:#CFC9BB;color:var(--ink);}
  .btn-icon{width:32px;height:32px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink-2);}
  .btn-icon:hover{border-color:#CFC9BB;color:var(--ink);}
  .btn-icon.on{background:#FAF6EC;border-color:#E4D4AE;color:#A87F35;}
  .btn-icon.on:hover{border-color:#D9C59A;color:#8F6A28;}

  .detail-body{padding:8px 28px 28px;overflow-y:auto;flex:1;}
  .notice{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding:9px 12px;background:#FAF6EC;border:1px solid #EDE3CC;border-radius:9px;font-size:12px;color:#7A6437;}
  .notice svg{flex:none;color:var(--brass);}

  .field{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .field:last-of-type{border-bottom:0;}
  .field-label{width:76px;flex:none;font-size:12px;color:var(--muted);}
  .field-val{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .field-val.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.02em;}
  .field-val.muted{color:var(--muted);font-size:12.5px;}
  .field-val.link{color:var(--accent);}
  .field-tools{display:flex;gap:2px;flex:none;}
  .tool{width:26px;height:26px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:#A9A398;}
  .tool:hover{background:#F2EFE7;color:var(--accent);}

  .sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);}
  .sec-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .sec-title span{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);}
  .sec-title em{font-style:normal;font-size:11px;color:var(--muted);background:#F4F1E9;padding:1.5px 6px;border-radius:5px;}
  .sec-title .add{margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:600;background:none;border:0;}
  .thumbs{display:flex;gap:12px;flex-wrap:wrap;}
  .thumb{width:118px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line);position:relative;flex:none;background:#F6F3EB;padding:0;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .cap{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;color:#fff;padding:14px 7px 5px;background:linear-gradient(transparent,rgba(20,18,14,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;}
  .thumb-upload{width:118px;height:84px;border-radius:9px;flex:none;border:1px dashed #D5CFC0;display:grid;place-items:center;color:var(--muted);background:#FCFBF7;font-size:11.5px;gap:3px;}
  .thumb-upload:hover{border-color:var(--accent);color:var(--accent);}

  .foot-meta{display:flex;gap:26px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line-soft);}
  .foot-meta dt{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;}
  .foot-meta dd{font-size:12px;color:var(--ink-2);}
  .note-block{font-size:13px;line-height:1.8;color:#3A362F;white-space:pre-wrap;padding:8px 0 4px;}

  /* ---------------- 详情二次验证 ---------------- */
  .locked{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 20px 40px;}
  .locked .seal{width:54px;height:54px;border-radius:50%;background:linear-gradient(160deg,#F7F4EB,#E9E2D2);border:1px solid #E2DAC8;display:grid;place-items:center;color:var(--brass);margin-bottom:16px;}
  .locked h4{font-size:13.5px;font-weight:650;}
  .locked p{font-size:12px;color:var(--muted);line-height:1.7;margin-top:7px;max-width:280px;}
  .locked .go{margin-top:18px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:9px;background:var(--accent);color:#fff;border:0;font-size:12.5px;font-weight:600;box-shadow:0 1px 2px rgba(18,91,74,.24);}
  .locked .go:hover{background:#0E4E3F;}
  .locked .hintline{margin-top:11px;font-size:10.5px;color:#B6AFA2;}
  .blur-rows{width:100%;max-width:300px;margin-top:26px;display:flex;flex-direction:column;gap:13px;opacity:.85;}
  .blur-rows i{height:9px;border-radius:5px;background:#EDE8DC;display:block;}
  .blur-rows i:nth-child(1){width:100%;}
  .blur-rows i:nth-child(2){width:62%;}
  .blur-rows i:nth-child(3){width:84%;}
  .blur-rows i:nth-child(4){width:44%;}

  /* ---------------- 浮层 ---------------- */
  .toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,10px);background:rgba(24,22,19,.92);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;}
  .toast.on{opacity:1;transform:translate(-50%,0);}

  .mask{position:absolute;inset:0;background:rgba(22,20,17,.34);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .mask.on{opacity:1;pointer-events:auto;}
  .modal{width:520px;max-height:86%;background:#fff;border-radius:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;transform:translateY(10px);transition:transform .22s;}
  .mask.on .modal{transform:none;}

  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;}
  .modal-head h3{font-size:15px;font-weight:650;}
  .modal-head .x{margin-left:auto;background:none;border:0;color:var(--muted);display:grid;place-items:center;width:28px;height:28px;border-radius:7px;}
  .modal-head .x:hover{background:#F4F1E9;color:var(--ink);}
  .modal-body{padding:18px 22px;overflow-y:auto;}
  .modal-foot{padding:14px 22px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-soft);}
  .btn-cancel{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink-2);}
  .btn-ok{height:36px;padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:13px;font-weight:600;}
  .btn-ok.danger{background:#A84A55;}

  .seg{display:flex;gap:6px;margin-bottom:16px;}
  .seg button{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-2);}
  .seg button.on{background:var(--accent-soft);border-color:#BBD5CB;color:var(--accent);font-weight:600;}
  /* 编辑态：类型已确定，保留分段控件但不可切换（切类型会丢失原有字段） */
  .seg.fm-locked{pointer-events:none;}
  .seg.fm-locked button:not(.on){opacity:.45;}

  .mf{margin-bottom:14px;}
  .mf label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .mf input,.mf textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:0;background:#fff;}
  .mf select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:0;background:#fff;height:36px;}
  .mf input:focus,.mf textarea:focus{border-color:#9CC0B3;box-shadow:0 0 0 3px rgba(18,91,74,.07);}
  .mf textarea{resize:none;min-height:84px;line-height:1.6;}
  .mf .row2{display:flex;gap:8px;}
  .mf .row2 input{flex:1;}
  .mf .mini{flex:none;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#F7F5EF;color:var(--accent);font-size:12px;font-weight:600;}
  .fm-imgs{display:flex;gap:8px;flex-wrap:wrap;}
  .fm-imgs .th{width:76px;height:56px;border-radius:7px;border:1px solid var(--line);overflow:hidden;position:relative;background:#F6F3EB;}
  .fm-imgs .th img{width:100%;height:100%;object-fit:cover;display:block;}
  .fm-imgs .rm{position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:rgba(20,18,14,.6);color:#fff;border:0;display:grid;place-items:center;font-size:10px;line-height:1;padding:0;}
  .fm-imgs .add{width:76px;height:56px;border-radius:7px;border:1px dashed #D5CFC0;background:#FCFBF7;color:var(--muted);display:grid;place-items:center;gap:2px;font-size:10.5px;}
  .fm-imgs .add:hover{border-color:var(--accent);color:var(--accent);}
  .fm-imgs .tip{font-size:11px;color:#A9A398;align-self:center;}

  .lightbox{position:absolute;inset:0;background:rgba(16,14,12,.92);z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:.2s;}
  .lightbox.on{opacity:1;pointer-events:auto;}
  .lightbox img{max-width:74%;max-height:76%;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .lightbox .cap{color:rgba(255,255,255,.75);font-size:12.5px;}
  .lightbox .close{position:absolute;top:20px;right:24px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;display:grid;place-items:center;}

  .lock{position:absolute;inset:0;z-index:70;background:#123F35;background-image:radial-gradient(ellipse at 50% 30%, rgba(174,136,80,.18), transparent 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:.25s;}
  .lock.on{opacity:1;pointer-events:auto;}
  .lock .mark{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.10);display:grid;place-items:center;margin-bottom:6px;}
  .lock h3{color:#fff;font-size:18px;font-weight:650;}
  .lock p{color:rgba(255,255,255,.58);font-size:12.5px;margin-bottom:8px;}
  .lock .box{display:flex;gap:8px;}
  .lock input{width:250px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:13.5px;padding:0 13px;outline:0;}
  .lock input::placeholder{color:rgba(255,255,255,.34);}
  .lock .box button{height:42px;padding:0 18px;border-radius:10px;border:0;background:#EBD9B4;color:#123F35;font-size:13px;font-weight:650;}
  .auth{position:absolute;inset:0;z-index:80;background:#123F35;background-image:radial-gradient(ellipse at 50% 24%, rgba(174,136,80,.20), transparent 62%);display:none;align-items:center;justify-content:center;}
  .auth.on{display:flex;}
  .auth-card{width:330px;background:#FBF9F3;border-radius:16px;padding:26px 28px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);}
  .auth-card .abrand{display:flex;justify-content:center;margin-bottom:22px;}

var state = {nav:'all', folder:null, typeFilter:'all', q:'', id:1, editing:null, type:'login', locked:true};
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

/* 收藏星标：filled 决定实心/描边，供列表角标与详情按钮复用 */
function starSvg(size, filled, sw){
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') +
    '" stroke="currentColor" stroke-width="' + (sw || 1.7) + '" stroke-linejoin="round">' +
    '<path d="M12 3.5l2.63 5.33 5.88.86-4.25 4.14 1 5.85L12 16.92l-5.26 2.76 1-5.85-4.25-4.14 5.88-.86z"/></svg>';
}
var STAR_SVG = starSvg(11, true);

/* ---------------- 文件夹 ---------------- */
var FOLDERS = [
  {name:'工作', color:'#4C8FD1'},
  {name:'个人', color:'#C9752F'},
  {name:'家庭共享', color:'#6E8F5A'}
];
var PALETTE = ['#4C8FD1','#6E8F5A','#C9752F','#8C6BB1','#A84A55','#35707B','#B08A2E','#5B6C8F','#7A8F4C'];
var newFolderColor = PALETTE[0];

function renderSwatches(el, sel, onPick){
  el.innerHTML = PALETTE.map(function(c){
    return '<button class="sw' + (c === sel ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + ';--c:' + c + '" title="' + c + '"></button>';
  }).join('');
  el.onclick = function(e){
    var b = e.target.closest('.sw');
    if (b) onPick(b.dataset.c);
  };
}
var renaming = null;      // 正在重命名的文件夹名
var menuFolder = null;    // 右键菜单指向的文件夹

function fcolor(name){
  var f = FOLDERS.filter(function(x){ return x.name === name; })[0];
  return f ? f.color : '#C9C2B2';
}
function fname(name){
  return FOLDERS.some(function(f){ return f.name === name; }) ? name : '未分类';
}
function fcount(name){
  return ITEMS.filter(function(x){ return fname(x.folder) === name; }).length;
}
function renderFolders(){
  var html = FOLDERS.map(function(f){
    if (renaming === f.name){
      return '<div class="nav-item nav-folder"><span class="fdot" style="background:' + f.color + '"></span>' +
        '<input class="frename" id="frename-input" value="' + esc(f.name) + '" maxlength="12" autocomplete="off" /></div>';
    }
    return '<div class="nav-item nav-folder' + (state.folder === f.name ? ' active' : '') + '" data-folder="' + esc(f.name) + '">' +
      '<span class="fdot" style="background:' + f.color + '"></span>' + esc(f.name) +
      '<span class="count">' + fcount(f.name) + '</span>' +
      '<span class="more" data-more="' + esc(f.name) + '" title="重命名 / 删除">···</span></div>';
  }).join('');
  var un = fcount('未分类');
  if (un){
    html += '<div class="nav-item nav-folder' + (state.folder === '未分类' ? ' active' : '') + '" data-folder="未分类">' +
      '<span class="fdot" style="background:#C9C2B2"></span>未分类<span class="count">' + un + '</span></div>';
  }
  $('#folder-list').innerHTML = html;
  var el = $('#frename-input');
  if (el){
    el.focus(); el.select();
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); el.blur(); }
      else if (e.key === 'Escape'){ renaming = null; renderFolders(); }
    });
    el.addEventListener('blur', function(){ if (renaming) commitRename(); });
  }
}
function newFolder(){
  newFolderColor = PALETTE[FOLDERS.length % PALETTE.length];
  $('#folder-new').classList.add('on');
  $('#fn-swatches').classList.add('on');
  $('#fn-dot').style.background = newFolderColor;
  renderSwatches($('#fn-swatches'), newFolderColor, pickNew);
  var el = $('#fn-input');
  el.value = '';
  el.focus();
}
function pickNew(c){
  newFolderColor = c;
  $('#fn-dot').style.background = c;
  renderSwatches($('#fn-swatches'), c, pickNew);
}
$('#btn-folder-new').addEventListener('click', newFolder);

$('#fn-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ commitNewFolder(); }
  if (e.key === 'Escape'){ this.value = ''; $('#folder-new').classList.remove('on'); $('#fn-swatches').classList.remove('on'); }
});
$('#fn-input').addEventListener('blur', function(){ if (this.value.trim()) commitNewFolder(); else { $('#folder-new').classList.remove('on'); $('#fn-swatches').classList.remove('on'); } });
function commitNewFolder(){
  var el = $('#fn-input');
  var name = el.value.trim();
  if (!name){ $('#folder-new').classList.remove('on'); $('#fn-swatches').classList.remove('on'); return; }
  if (FOLDERS.some(function(f){ return f.name === name; })){ toast('已有同名文件夹'); el.select(); return; }
  FOLDERS.push({name: name, color: newFolderColor});
  el.value = '';
  $('#folder-new').classList.remove('on');
  $('#fn-swatches').classList.remove('on');
  state.folder = name; state.nav = 'all';
  renderFolders(); renderList();
  toast('已新建文件夹「' + name + '」');
}

/* 文件夹行的点击 / 更多菜单 */
$('#folder-list').addEventListener('click', function(e){
  var more = e.target.closest('[data-more]');
  if (more){ e.stopPropagation(); openFolderMenu(more.dataset.more, more); return; }
  var row = e.target.closest('[data-folder]');
  if (!row) return;
  state.nav = 'all'; state.folder = row.dataset.folder; state.typeFilter = 'all';
  renderFolders(); renderList();
});

function openFolderMenu(name, anchor){
  menuFolder = name;
  var cur = fcolor(name);
  renderSwatches($('#fx-swatches'), cur, function(c){
    FOLDERS.forEach(function(f){ if (f.name === menuFolder) f.color = c; });
    $('#fmenu').classList.remove('on');
    renderFolders(); renderList();
    toast('颜色已更新');
  });
  var m = $('#fmenu');
  var a = anchor.getBoundingClientRect();
  var base = document.querySelector('.app').getBoundingClientRect();
  m.classList.add('on');
  m.style.left = Math.max(8, a.right - base.left - 138) + 'px';
  m.style.top = (a.bottom - base.top + 4) + 'px';
}
document.addEventListener('click', function(e){
  if (!e.target.closest('#fmenu') && !e.target.closest('[data-more]')) $('#fmenu').classList.remove('on');
});
$('#fx-rename').addEventListener('click', function(){
  $('#fmenu').classList.remove('on');
  renaming = menuFolder;
  renderFolders();
});
function commitRename(){
  var el = $('#frename-input');
  if (!el){ renaming = null; return; }
  var old = renaming;
  var name = el.value.trim();
  renaming = null;
  if (!name || name === old){ renderFolders(); return; }
  if (FOLDERS.some(function(f){ return f.name === name; })){
    toast('已有同名文件夹'); renderFolders(); return;
  }
  FOLDERS.forEach(function(f){ if (f.name === old) f.name = name; });
  ITEMS.forEach(function(x){ if (x.folder === old) x.folder = name; });
  if (state.folder === old) state.folder = name;
  renderFolders(); renderList();
  toast('已重命名为「' + name + '」');
}
$('#fx-del').addEventListener('click', function(){
  $('#fmenu').classList.remove('on');
  askDeleteFolder(menuFolder);
});

function askDeleteFolder(name){
  var n = fcount(name);
  $('#del-title').textContent = '删除文件夹「' + name + '」？';
  $('#del-text').textContent = n ? ('其中 ' + n + ' 条凭证会移到「未分类」，不会被删除。') : '这个文件夹里没有凭证，可直接删除。';
  $('#del-ok').textContent = '删除文件夹';
  pendingDel = {kind:'folder', name:name};
  $('#mask-del').classList.add('on');
}
function pool(){
  var arr = ITEMS.slice();
  if (state.nav === 'fav') arr = arr.filter(function(x){ return x.fav; });
  if (state.typeFilter !== 'all') arr = arr.filter(function(x){ return x.type === state.typeFilter; });
  if (state.folder) arr = arr.filter(function(x){ return x.folder === state.folder; });
  if (state.q){
    var q = state.q.toLowerCase();
    arr = arr.filter(function(x){ return (x.name + ' ' + (x.user||'') + ' ' + (x.cardno||'') + ' ' + (x.note||'')).toLowerCase().indexOf(q) > -1; });
  }
  return arr;
}

function renderCounts(){
  $('#c-all').textContent = ITEMS.length;
  $('#c-fav').textContent = ITEMS.filter(function(x){ return x.fav; }).length;
}

function maskNo(s){
  var d = String(s || '').replace(/\s/g,'');
  if (!d) return '未填写卡号';
  return d.length <= 4 ? d : '•••• ' + d.slice(-4);
}

/* 左栏只表达「位置」：全部 / 收藏 / 某个文件夹；类型筛选交给列表上方的筛选条 */
function syncNav(){
  $$('.nav-item[data-nav]').forEach(function(n){
    var on = (n.dataset.nav === 'fav') ? (state.nav === 'fav') : (state.nav === 'all' && !state.folder);
    n.classList.toggle('active', on);
  });
  $$('#list-tabs .lt').forEach(function(b){
    b.classList.toggle('on', b.dataset.tf === state.typeFilter);
  });
}

function renderList(){
  var arr = pool();
  var names = {all:'全部凭证', fav:'收藏', login:'账号', card:'卡片证件', note:'安全笔记'};
  var title = state.folder ? state.folder : names[state.nav];
  if (state.typeFilter !== 'all'){
    title = (title === names.all) ? names[state.typeFilter] : (title + ' · ' + names[state.typeFilter]);
  }
  $('#list-title').textContent = title;
  syncNav();
  var imgCount = arr.filter(function(x){ return x.images && x.images.length; }).length;
  $('#list-sub').textContent = arr.length + ' 条' + (imgCount ? ' · ' + imgCount + ' 条含图片' : '');

  var wrap = $('#rows');
  if (!arr.length){
    wrap.innerHTML = '<div class="empty">没有匹配的凭证<br/>换个筛选条件，或点右上角「新建」</div>';
    return;
  }
  if (!arr.some(function(x){ return x.id === state.id; })){ state.id = arr[0].id; state.locked = true; }

  wrap.innerHTML = arr.map(function(it){
    var dot = it.type === 'card' ? 's-img' : (it.type === 'note' ? 's-none' : (it.pwd && it.pwd.length >= 12 ? 's-strong' : 's-mid'));
    var sub = it.type === 'card' ? ('卡片证件 · ' + maskNo(it.cardno)) : (it.type === 'note' ? '安全笔记' : (it.user || '未填写用户名'));
    var mark = it.fav ? '<span class="fav-mark" title="已收藏">' + STAR_SVG + '</span>' : '';
    return '<button class="row' + (it.id === state.id ? ' sel' : '') + '" data-id="' + it.id + '">' +
      '<div class="tile" style="background:' + it.color + ';color:' + it.ink + ';">' + it.g + '</div>' +
      '<div class="row-txt"><b>' + esc(it.name) + '</b><span>' + esc(sub) + '</span></div>' +
      mark +
      '<span class="strength ' + dot + '"></span></button>';
  }).join('');

  $$('#rows .row').forEach(function(el){
    el.addEventListener('click', function(){
      var nid = +el.dataset.id;
      if (nid !== state.id) state.locked = true;   /* 换条目即重新上锁 */
      state.id = nid;
      renderList();
    });
  });
  renderDetail();
}

  if (kind === 'pwd'){
    tools = '<button class="tool" data-reveal title="显示/隐藏"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></button>' +
      '<button class="tool" data-copy="' + esc(current.pwd) + '" data-msg="密码已复制，10 秒后清空" title="复制"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M15 6.5A2.5 2.5 0 0012.5 4H6.5A2.5 2.5 0 004 6.5v6A2.5 2.5 0 006.5 15"/></svg></button>';

  return '<div class="field"><div class="field-label">' + label + '</div>' +
    '<div class="field-val' + (kind === 'pwd' ? ' mono' : '') + (kind === 'url' ? ' link' : '') + '"' +
    (kind === 'pwd' ? ' data-shown="0"' : '') + '>' + val + '</div>' +

var toastTimer;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');

function copy(text, msg){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);

  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  toast(msg || '已复制');
}

/* ---------------- 登录 / 注册 ---------------- */
var authMode = 'login';

function strengthOf(v){
  if (!v) return ['', ''];
  if (v.length < 8) return ['至少 8 位', '#A84A55'];
  var kinds = /[a-z]/.test(v) + /[A-Z]/.test(v) + /\d/.test(v) + /[^a-zA-Z0-9]/.test(v);
  if (v.length >= 12 && kinds >= 3) return ['强度：强', '#2E7D51'];
  return ['强度：中', '#C9752F'];
}
function renderAuthStrength(){
  var t = $('#auth-strength');
  if (authMode !== 'register'){ t.textContent = ''; return; }
  var r = strengthOf($('#auth-pwd').value);
  t.textContent = r[0];
  t.style.color = r[1];
}
function setAuthMode(m){
  authMode = m;
  var reg = m === 'register';
  $('#auth-title').textContent = reg ? '创建你的保险库' : '登录 Coffer';
  $('#auth-sub').textContent = reg
    ? '主密码用于在本地加密所有数据，服务端只保存密文。'
    : '输入邮箱和主密码解锁你的保险库。';
  $('#auth-pwd-lb').textContent = reg ? '设置主密码' : '主密码';
  $('#auth-pwd').placeholder = reg ? '至少 8 位，建议 12 位以上' : '主密码';
  $('#auth-pwd2-w').style.display = reg ? 'block' : 'none';
  $('#auth-ack-w').style.display = reg ? 'flex' : 'none';
  $('#auth-strength').style.display = reg ? 'block' : 'none';
  $('#auth-ok').textContent = reg ? '创建保险库' : '登录';
  $('#auth-switch').textContent = reg ? '已有账号？直接登录 →' : '还没有账号？创建保险库 →';
  $('#auth-pwd2').value = '';
  $('#auth-ack').checked = false;
  renderAuthStrength();
}
$('#auth-switch').addEventListener('click', function(){
  var email = $('#auth-email').value;
  setAuthMode(authMode === 'login' ? 'register' : 'login');
  $('#auth-email').value = email;
  $('#auth-pwd').value = '';
  ($('#auth-pwd')).focus();
});
function submitAuth(){
  var email = $('#auth-email').value.trim();
  var pwd = $('#auth-pwd').value;
  if (!email || email.indexOf('@') === -1){ toast('请输入有效的邮箱地址'); $('#auth-email').focus(); return; }
  if (authMode === 'login'){
    if (!pwd){ toast('请输入主密码'); $('#auth-pwd').focus(); return; }
    $('#auth').classList.remove('on');
    renderList();   /* 重新登录：恢复列表与默认选中项 */
    toast('欢迎回来，' + email.split('@')[0]);
    return;
  }
  /* 注册：主密码是解锁凭证，校验从严 */
  if (pwd.length < 8){ toast('主密码至少 8 位'); $('#auth-pwd').focus(); return; }
  if (pwd !== $('#auth-pwd2').value){ toast('两次输入的主密码不一致'); $('#auth-pwd2').focus(); return; }
  if (!$('#auth-ack').checked){ toast('请先确认你已了解主密码无法找回'); return; }
  $('#auth').classList.remove('on');
  renderList();
  toast('保险库已创建，已自动登录');
}
$('#auth-ok').addEventListener('click', submitAuth);

  $('#' + id).addEventListener('keydown', function(e){ if (e.key === 'Enter') submitAuth(); });
});

  this.value = '';
  if (!f) return;
  if (f.size > 3 * 1024 * 1024){ toast('图片请小于 3MB'); return; }
  var rd = new FileReader();
  rd.onload = function(){ setPfAvatar(rd.result); };
  rd.readAsDataURL(f);
});
$('#pf-avatar-rm').addEventListener('click', function(){ setPfAvatar(null); toast('已移除自定义头像'); });
$('#pf-save').addEventListener('click', saveProfile);
$('#pf-name').addEventListener('keydown', function(e){ if (e.key === 'Enter') saveProfile(); });
function saveProfile(){
  var name = $('#pf-name').value.trim();
  if (!name){ toast('昵称不能为空'); $('#pf-name').focus(); return; }
  ME.name = name; ME.color = pfColor; ME.avatar = pfAvatarData;   /* 邮箱仅展示，不可修改 */
  renderUser();
  $('#mask-profile').classList.remove('on');
  toast('个人资料已更新');
}

renderCounts();
renderFolders();
renderList();
</script>
</body>
</html>
