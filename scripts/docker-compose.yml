# ============================================================================
# Coffer 本地/单机环境编排
#   MySQL 8.0 + RustFS（S3 兼容对象存储）+ API（Hono）+ Web（Next.js 静态站）
#
# 启动全部：docker compose -f scripts/docker-compose.yml up -d --build
# 仅数据库：docker compose -f scripts/docker-compose.yml up -d mysql
# 停止：    docker compose -f scripts/docker-compose.yml down
# 重置：    docker compose -f scripts/docker-compose.yml down -v（会清空数据）
#
# 生产部署时请务必替换 JWT_SECRET 与 RustFS 密钥，并配置 HTTPS。
# 环境变量可写入同目录 .env（参考 .env.example）。
# ============================================================================
name: coffer

services:
  mysql:
    image: mysql:8.0
    container_name: coffer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffer}
      MYSQL_USER: ${MYSQL_USER:-coffer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据目录为空（首次初始化）时执行
      - ../docs/sql/coffer-v1.sql:/docker-entrypoint-initdb.d/01-coffer-v1.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rustfs:
    # RustFS：S3 兼容对象存储，只保存客户端加密后的密文附件
    image: rustfs/rustfs:latest
    container_name: coffer-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      TZ: Asia/Shanghai
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s

  api:
    build:
      context: ../coffer-monorepo
      dockerfile: apps/api/Dockerfile
    image: coffer-api:local
    container_name: coffer-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-coffer}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-coffer}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET:-coffer-dev-secret-change-me-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7200}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:8080}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-coffer}
      S3_FORCE_PATH_STYLE: 'true'
      TZ: Asia/Shanghai
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

  web:
    build:
      context: ../coffer-monorepo
      dockerfile: apps/web/Dockerfile
    image: coffer-web:local
    container_name: coffer-web
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

volumes:
  mysql_data:
    name: coffer_mysql_data
  rustfs_data:
    name: coffer_rustfs_data
